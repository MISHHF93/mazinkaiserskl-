services:
  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      ENVIRONMENT: production

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    ports:
      - "5173:80"
    depends_on:
      - backend
